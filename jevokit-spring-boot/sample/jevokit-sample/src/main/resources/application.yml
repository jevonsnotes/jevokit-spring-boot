
# jasypt 演示默认密钥（demo 应用开箱即用）：环境变量 JASYPT_KEY 或运行工作目录 application-local.yml 可覆盖，优先级高于此默认值。
# 注意：下方 datasource.password 的 ENC(...) 密文与该演示密钥配套——若改用自有 JASYPT_KEY，旧密文将解密失败
# （EncryptionOperationNotPossibleException），需用自有密钥重新加密，或在 application-local.yml 覆盖 datasource 段。
# 生产环境必须通过环境变量/local 文件注入自有密钥并重算全部 ENC 密文。
jasypt:
  key: ${JASYPT_KEY:DemoJasyptKey123456} # 演示默认密钥（16+ 字符任意字符串；生产必须替换）
  encryptor:
    iv-generator-classname: org.jasypt.iv.NoIvGenerator
    bean: jevokitStringEncryptor
    password: ${jasypt.key}
jevokit:
  # 加解密演示默认密钥（demo 应用开箱即用，非 starter 库内置密钥）
  # 仅用于快速体验，生产环境必须替换为自有密钥；库代码本身不内置任何密钥（未配置时无参 API 抛
  # IllegalStateException，见 SecurityUtil/CryptoProperties）。密钥对为本次演示新生成，与 api.client 那组无关联。
  # 运行工作目录 application-local.yml（不入库）中的同名键优先生效，可整体覆盖以下演示值。
  crypto:
    rsa-public-key:  # RSA 公钥（X.509/Base64，2048 位，与下行私钥成对）
    rsa-private-key:  # RSA 私钥（PKCS#8/Base64，2048 位；无参用法为私钥加密、公钥解密）
    aes-key: DemoAesKey123456 # AES 密钥（16 字节演示；可选 16/24/32 字节对应 AES-128/192/256）
    sm4-key: DemoSm4Key123456 # SM4 密钥（16 字节演示；脱敏 DesUtil 默认读取此键）
  api:
    access:
      tokens:
        - path: "/desensitization/**"
          token: "demo-api-token"
      header: JEVOKIT_API_ACCESS_TOKEN
    client:
      - id: client-demo-1
        secret-key: demo-sm4-secret
        private-key: MIGTAgEAMBMGByqGSM49AgEGCCqBHM9VAYItBHkwdwIBAQQgk5B6bcSXNwvtfd6nufsDHEPOu8N2hHKJMBW5blZP2eSgCgYIKoEcz1UBgi2hRANCAASxO58/zvEseRlMZtRlojzn7m4jAaZPTDSOalPCSk3nnGW0GmEu2ZhfWDNH+Nq8wA6BLodb2gwI9NF+F1Mp3p9R
        public-key: MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAEsTufP87xLHkZTGbUZaI85+5uIwGmT0w0jmpTwkpN55xltBphLtmYX1gzR/javMAOgS6HW9oMCPTRfhdTKd6fUQ==
        prevent-replay: false
        verify: false
        decrypt: true
        encrypt: true
        allow-ip:
          - 192.0.2.*
        allow-path:
          - /secure/test
        print:
          request-ciphertext: true
          request-plaintext: true
          response-ciphertext: true
          response-plaintext: true
      - id: client-demo-2
        secret-key: demo-aes-secret
        private-key: MIGTAgEAMBMGByqGSM49AgEGCCqBHM9VAYItBHkwdwIBAQQgTZMk6BwQwTqmU+pg/ObaUqMuYtB0wb7jN1aCqjhKB8CgCgYIKoEcz1UBgi2hRANCAASsN3z5bjfH04PH//4kVKrPRBo1aM0Pt8egiQQltEh6BmcwFt9v4yOq5HjX9UHA84MBNgWfAOgxcffcM9+NWGBC
        public-key: MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAErDd8+W43x9ODx//+JFSqz0QaNWjND7fHoIkEJbRIegZnMBbfb+MjquR41/VBwPODATYFnwDoMXH33DPfjVhgQg==
        prevent-replay: false

  desensitization:
    algorithm:
      view: basic
      log: mixed
    prop-pattern:
      lv0:
        name: # 名称
          - "(?i).*name"
          - "brands.*"
        address: # 地址
          - "(?i).*address"
        bank-line-num: # 银行联行号
          - "(?i).*bankLineNum"
        license-plate: # 车牌号
          - "(?i).*licensePlate"
      lv9:
        id-card: # 身份证
          - "(?i)idCard"
        mobile: # 手机号
          - "(?i).*mobile"
        phone: # 电话
          - "(?i).*phone"
        email: # 电子邮件
          - "(?i).*mail"
        bank-card: # 银行卡
          - "(?i).*bankCard"
        password: # 密码
          - "(?i).*password"
    level-power-key:
      lv0:
        - DST_POWER_LV0
      lv9:
        - DST_POWER_LV9

  ok:
    http:
#      proxy-username: xxx
#      proxy-password: xxx
      proxy-mode: always
      proxy-ignores:
        - 192.0.2.*
        - 198.51.100.*
        - localhost
      error-mode: throwout # 非2xx处置：throwout抛OkHttpStatusRuntimeException / quiet静默返回错误体
      proxy-hosts:
        - 192.0.2.1:8088

  nogen:
    access-token: demo-token # API访问令牌
    enable-api: true # 开启api
  audit:
    log: # 审计日志
      enabled: true # 开启审计日志 默认false
      enabled-around: true #启用环绕审计，将会在请求处理前后调用save方法各一次
      ignore-non-user: false #忽略非用户操作日志
      content-limit:
        strategy: trunc
        query-string: -1
        request-body: -1
        response-body: -1
      persistent:
        mode: db
        db-migrate-period: day
      event-types:
        patterns:
          GET: # 请求方法
            QUERY: # 事件类型
              - /*/{id:[0-9,]+} # 事件匹配规则
          POST:
            QUERY:
              - /*/search
            CREATE:
              - /*/
            OTHERS:
              - /**
          PUT:
            UPDATE:
              - /**
          DELETE:
            DELETE:
              - /**/{id:[0-9,]+}
        name-mapper:
          QUERY: 查询
          CREATE: 创建
          DELETE: 删除
          OTHERS: 其他



  security:
    xss: # 跨站脚本
      enabled: true
      mode: clear
      ignore-response: false
      url-patterns: # 过滤请求路径
        - /**
      url-exclude-patterns: # 排除请求路径
        - /test/xss/form/exclude
        - /jevokit/**
        - /workflow/**
      addition-tainted-patterns:
        - ((?i)javascript:)
    path-traversal: # 路径遍历
      enabled: true
      mode: clear
      url-patterns:
        - /**
      url-exclude-patterns:
        - /test/xss/form/exclude
        - /desensitization/**
      addition-tainted-patterns:
        - \.\./
        - /etc/.*
    sql-inject: #sql注入
      enabled: true
      mode: clear
      url-patterns:
        - /**
      url-exclude-patterns:
        - /test/xss/form/exclude
      addition-tainted-patterns:
        - ((?i)[ ]+(AND|OR)[ ]+)
        # —— 激进防护 opt-in（默认注释不启用；内部管理端可放开，公开入口评估误清洗风险后再启用）——
        # - ((?i)union[ ]+select)   # union 组合查询注入
        # - '--'                    # 行注释截断（标准 SQL 方言）
        # - '#'                     # 行注释截断（MySQL 方言；yaml 中必须加引号，防被当作注释）
        # - [/][*].*?[*][/]         # 块注释截断（非贪婪；等价写法 /\*.*?\*/）
    code-inject: #代码注入
      enabled: true
      negative: false # 是否反转匹配结果。默认false，当规则匹配时，认定为安全，CodeInjectUtil.isSafe返回true
      namespaces:
        default:
        - '[\s\S]*'
spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: jevokit-sample
  # 采用H2内存模式作为默认启动库，如有个性库请调整以下配置，并关闭H2控制台（h2-console）
  datasource:
    #url: jdbc:h2:file:./h2data/test # 文件存储方式
    url: jdbc:h2:mem:test # 内存存储方式
    username: postgres
    # H2 内存库自建库自注册凭据，明文任意一致值均可；此处演示明文 DemoDbPassword123，
    # 用演示密钥 DemoJasyptKey123456（jasypt.key 默认值）加密——改用自有 JASYPT_KEY 时此密文解密会失败，
    # 需用自有密钥重算（JasyptTest 加密入口）或在 application-local.yml 覆盖本段。
    password: ENC(qPksSqpFLyoey8nYmi639icfJK8ZCoO1G6t/S7YQauE=)
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false # 按需开启 http://localhost:应用端口/h2-console
  redis:
    host: localhost
    port: 6379

#server:
