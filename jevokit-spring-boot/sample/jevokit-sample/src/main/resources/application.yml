# camunda console http://host:port/camunda/
camunda.bpm:
  generic-properties:
    properties:
#      enforceHistoryTimeToLive: false
      historyTimeToLive: 3650 #10年

  admin-user:
    id: demoAdmin # Camunda 7.x 资源 ID 白名单默认 [a-zA-Z0-9]+|camunda-admin，连字符非法（password 非资源 ID 不受限）
    password: demo-password
    firstName: Kermit
  filter:
    create: All tasks
  webapp:
    #禁止index跳转到Camunda自带的管理界面，默认true
    index-redirect-enabled: false
  auto-deployment-enabled: true



#rocketmq配置 v4
rocketmq:
  name-server: localhost:9876
  consumer:
    customized-trace-topic: TOPIC_TRACE_JEVOKIT
    access-key: ${rocketmq.producer.access-key}
    secret-key: ${rocketmq.producer.secret-key}
  producer:
    group: JEVOKIT_PRODUCER_GROUP
    send-message-timeout: 3000
    access-key: demo-access-key
    secret-key: demo-secret-key
